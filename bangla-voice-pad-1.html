<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বলুন, লেখা হবে — Bangla Voice Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#10382A;        /* bottle green */
    --field-deep:#0A2A1F;
    --page:#FAF6EC;         /* paper */
    --ink:#20241F;
    --circle:#F03D3B;       /* mic red */
    --circle-deep:#C22A2C;
    --muted:#8FB3A3;
    --line:rgba(250,246,236,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Hind Siliguri',system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, var(--field) 0%, var(--field-deep) 100%);
    color:var(--page);
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;
  }
  .wrap{width:100%;max-width:640px;display:flex;flex-direction:column;flex:1;padding:20px 16px 14px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:1.45rem;letter-spacing:.01em}
  h1 span{color:var(--muted);font-family:'Hind Siliguri',sans-serif;font-weight:400;font-size:.8rem;display:block;margin-top:2px}
  select{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:8px;padding:6px 8px;font-family:inherit;font-size:.85rem;cursor:pointer;
  }
  select:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
  option{color:var(--ink)}

  .sheet{
    background:var(--page);color:var(--ink);border-radius:14px;
    flex:1;display:flex;flex-direction:column;min-height:240px;
    box-shadow:0 12px 32px rgba(0,0,0,.32), inset 0 0 0 1px rgba(32,36,31,.06);
    overflow:hidden;
  }
  textarea{
    flex:1;width:100%;border:0;resize:none;background:transparent;color:var(--ink);
    font-family:'Noto Serif Bengali',serif;font-size:1.28rem;line-height:2;
    padding:18px 20px 8px;
  }
  textarea:focus{outline:none}
  textarea::placeholder{color:rgba(32,36,31,.38);font-family:'Hind Siliguri',sans-serif;font-size:1.02rem;line-height:1.7}
  .interim{
    min-height:2.2em;padding:2px 20px 12px;
    font-family:'Noto Serif Bengali',serif;font-size:1.1rem;color:rgba(16,56,42,.55);font-style:italic;
  }
  .meta{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 20px;border-top:1px dashed rgba(32,36,31,.18);
    font-size:.8rem;color:rgba(32,36,31,.55);
  }

  .status{display:flex;align-items:center;gap:8px;justify-content:center;margin:14px 0 10px;font-size:.95rem;color:var(--muted);min-height:1.4em}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .listening .dot{background:var(--circle);animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}

  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .chip{
    font-family:'Noto Serif Bengali',serif;font-size:1.15rem;line-height:1;
    background:rgba(250,246,236,.08);color:var(--page);border:1px solid var(--line);
    border-radius:10px;padding:10px 16px;cursor:pointer;min-width:52px;
  }
  .chip:hover{background:rgba(250,246,236,.16)}
  .chip:focus-visible{outline:2px solid var(--page);outline-offset:2px}

  .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-bottom:6px}
  .side{display:flex;justify-content:center}
  button.action{
    font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:.95rem;
    border:1px solid var(--line);background:rgba(250,246,236,.08);color:var(--page);
    border-radius:12px;padding:12px 18px;cursor:pointer;
  }
  button.action:hover{background:rgba(250,246,236,.16)}
  button.action:focus-visible{outline:2px solid var(--page);outline-offset:2px}
  #copyBtn{background:var(--page);color:var(--field);border-color:transparent}
  #copyBtn:hover{background:#fff}

  /* The red circle — mic */
  .micWrap{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center}
  #micBtn{
    width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;
    background:radial-gradient(circle at 35% 30%, var(--circle) 0%, var(--circle-deep) 85%);
    box-shadow:0 8px 22px rgba(194,42,44,.45), inset 0 -3px 6px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;color:#fff;
    transition:transform .12s ease;
  }
  #micBtn:active{transform:scale(.94)}
  #micBtn:focus-visible{outline:3px solid var(--page);outline-offset:3px}
  #micBtn svg{width:30px;height:30px;fill:#fff}
  .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--circle);opacity:0;pointer-events:none}
  .listening .ring{animation:sonar 1.6s ease-out infinite}
  @keyframes sonar{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.45);opacity:0}}
  @media (prefers-reduced-motion:reduce){.ring,.dot{animation:none !important}}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--page);color:var(--field);font-weight:600;font-size:.95rem;
    padding:10px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35);
    opacity:0;pointer-events:none;transition:all .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .err{
    display:none;background:rgba(240,61,59,.14);border:1px solid rgba(240,61,59,.5);
    color:#FFD9D8;border-radius:12px;padding:12px 16px;font-size:.92rem;margin-bottom:12px;line-height:1.6;
  }
  .err.show{display:block}

  footer{padding:10px 0 4px;text-align:center;font-size:.75rem;color:rgba(143,179,163,.7)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>বলুন, লেখা হবে<span>Bangla voice typing</span></h1>
    <select id="lang" aria-label="ভাষা নির্বাচন">
      <option value="bn-BD" selected>বাংলা (বাংলাদেশ)</option>
      <option value="bn-IN">বাংলা (ভারত)</option>
      <option value="en-US">English (US)</option>
    </select>
  </header>

  <div class="err" id="err"></div>

  <div class="sheet">
    <textarea id="out" placeholder="নিচের লাল বোতাম চেপে কথা বলুন — আপনার কথা এখানে লেখা হয়ে যাবে।&#10;&#10;বলতে পারেন: “দাঁড়ি” (।), “কমা” (,), “নতুন লাইন”"></textarea>
    <div class="interim" id="interim" aria-hidden="true"></div>
    <div class="meta"><span id="count">শব্দ: ০</span><span>লেখা শেষে “কপি করুন” চাপুন</span></div>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="statusText">প্রস্তুত — বোতাম চেপে শুরু করুন</span></div>

  <div class="chips" role="group" aria-label="যতিচিহ্ন">
    <button class="chip" data-ins="।">।</button>
    <button class="chip" data-ins=",">,</button>
    <button class="chip" data-ins="?">?</button>
    <button class="chip" data-ins="!">!</button>
    <button class="chip" data-ins="&#10;" aria-label="নতুন লাইন">⏎</button>
  </div>

  <div class="controls">
    <div class="side"><button class="action" id="clearBtn">মুছুন</button></div>
    <div class="micWrap">
      <span class="ring"></span>
      <button id="micBtn" aria-label="ভয়েস টাইপিং চালু বা বন্ধ করুন" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
    </div>
    <div class="side"><button class="action" id="copyBtn">কপি করুন</button></div>
  </div>

  <footer>Chrome ব্রাউজারে সবচেয়ে ভালো কাজ করে · ইন্টারনেট সংযোগ প্রয়োজন</footer>
</div>

<div class="toast" id="toast">কপি হয়েছে ✓</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const app = $('app'), out = $('out'), interim = $('interim'),
        statusText = $('statusText'), micBtn = $('micBtn'),
        errBox = $('err'), toast = $('toast'), count = $('count'), langSel = $('lang');

  const bnDigits = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const updateCount = () => {
    const words = out.value.trim() ? out.value.trim().split(/\s+/).length : 0;
    count.textContent = 'শব্দ: ' + bnDigits(words);
  };
  out.addEventListener('input', updateCount);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    errBox.textContent = 'এই ব্রাউজারে ভয়েস টাইপিং কাজ করে না। অনুগ্রহ করে Google Chrome ব্যবহার করুন।';
    errBox.classList.add('show');
    micBtn.disabled = true;
    return;
  }

  let rec = null, active = false, restartTimer = null;

  // Spoken commands → punctuation (applied to final results only)
  const COMMANDS = [
    [/\s*নতুন (?:প্যারা|অনুচ্ছেদ)\s*/g, '\n\n'],
    [/\s*নতুন লাইন\s*/g, '\n'],
    [/\s*দাঁড়ি\s*/g, '। '],
    [/\s*কমা\s*/g, ', '],
    [/\s*প্রশ্ন ?চিহ্ন\s*/g, '? '],
  ];
  const applyCommands = t => { COMMANDS.forEach(([re, rep]) => t = t.replace(re, rep)); return t; };

  function build(){
    rec = new SR();
    rec.lang = langSel.value;
    rec.continuous = true;
    rec.interimResults = true;

    rec.onresult = (e) => {
      let ghost = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        if(r.isFinal){
          let t = applyCommands(r[0].transcript.trim());
          if(t){
            const before = out.value;
            const needsSpace = before && !/[\s\n]$/.test(before) && !/^[।,?!]/.test(t);
            out.value = before + (needsSpace ? ' ' : '') + t;
          }
        } else {
          ghost += r[0].transcript;
        }
      }
      interim.textContent = ghost;
      out.scrollTop = out.scrollHeight;
      updateCount();
    };

    rec.onerror = (e) => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        stop();
        errBox.textContent = 'মাইক্রোফোনের অনুমতি দেওয়া হয়নি। ঠিকানার পাশে 🔒 আইকনে ক্লিক করে Microphone → Allow করুন। (পেজটি অবশ্যই https বা localhost থেকে খুলতে হবে।)';
        errBox.classList.add('show');
      }
      // 'no-speech' and 'network' recover via onend auto-restart
    };

    // Chrome stops after silence — restart quietly while active
    rec.onend = () => {
      interim.textContent = '';
      if(active){ restartTimer = setTimeout(() => { try{ rec.start(); }catch(_){} }, 250); }
    };
  }

  function start(){
    errBox.classList.remove('show');
    build();
    try{ rec.start(); }catch(_){ return; }
    active = true;
    app.classList.add('listening');
    micBtn.setAttribute('aria-pressed','true');
    statusText.textContent = 'শুনছি… কথা বলুন';
  }
  function stop(){
    active = false;
    clearTimeout(restartTimer);
    if(rec){ rec.onend = null; try{ rec.stop(); }catch(_){} }
    interim.textContent = '';
    app.classList.remove('listening');
    micBtn.setAttribute('aria-pressed','false');
    statusText.textContent = 'প্রস্তুত — বোতাম চেপে শুরু করুন';
  }

  micBtn.addEventListener('click', () => active ? stop() : start());
  langSel.addEventListener('change', () => { if(active){ stop(); start(); } });
  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm'){ e.preventDefault(); active ? stop() : start(); }
  });

  // Punctuation chips insert at cursor
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const ins = chip.dataset.ins;
      const s = out.selectionStart, epos = out.selectionEnd;
      let before = out.value.slice(0, s);
      if(/[।,?!]/.test(ins)) before = before.replace(/\s+$/, '');
      out.value = before + ins + (ins === '\n' ? '' : ' ') + out.value.slice(epos);
      const pos = before.length + ins.length + (ins === '\n' ? 0 : 1);
      out.focus(); out.setSelectionRange(pos, pos);
      updateCount();
    });
  });

  $('clearBtn').addEventListener('click', () => {
    if(out.value && !confirm('সব লেখা মুছে ফেলবেন?')) return;
    out.value = ''; interim.textContent = ''; updateCount(); out.focus();
  });

  $('copyBtn').addEventListener('click', async () => {
    const text = out.value.trim();
    if(!text) return;
    try{
      await navigator.clipboard.writeText(text);
    }catch(_){
      out.select(); document.execCommand('copy');
      out.setSelectionRange(out.value.length, out.value.length);
    }
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  });
})();
</script>
</body>
</html>
