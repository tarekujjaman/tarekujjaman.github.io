<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Glam Makeover Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0015;--gold:#f5c518;--gold2:#e8a000;--pink:#ff6eb4;--pur:#9b59b6;
  --text:#fff;--card:rgba(255,255,255,0.07);--card-b:rgba(255,255,255,0.14);
  --r:16px;--tool-sz:66px;
  --tb-h:52px;--tab-h:44px;--panel-h:72px;--bar-h:90px;
}
html,body{width:100%;height:100%;overflow:hidden;
  background:linear-gradient(145deg,var(--bg) 0%,#1a0535 100%);
  font-family:'Nunito',sans-serif;color:var(--text);
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
/* STARS */
#stars-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#confetti-canvas{position:fixed;inset:0;z-index:50;pointer-events:none}
/* BULBS */
.bulb-wrap{position:fixed;inset:0;z-index:1;pointer-events:none}
.bulb{position:absolute;width:18px;height:18px;border-radius:50%;
  background:#ffe57a;
  box-shadow:0 0 6px #ffe57a,0 0 18px rgba(255,229,122,.55);
  transition:box-shadow .3s}
.bulb.active{box-shadow:0 0 10px #fff,0 0 28px #ffe57a,0 0 50px rgba(255,229,122,.7);
  animation:bulbPulse 1.4s infinite}
@keyframes bulbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
/* SCREENS */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;
  transition:opacity .4s,transform .4s}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97)}
/* INTRO */
#intro{gap:14px;padding:24px;text-align:center}
.game-title{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,7vw,3.2rem);
  font-weight:900;line-height:1.1;
  background:linear-gradient(135deg,var(--gold) 0%,var(--pink) 55%,#b388ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.game-sub{font-size:clamp(.8rem,3vw,1rem);opacity:.65;margin-bottom:4px}
.intro-char{width:min(180px,48vw);filter:drop-shadow(0 8px 20px rgba(255,110,180,.4))}
.btn-start{background:linear-gradient(135deg,var(--pink),var(--gold));
  border:none;border-radius:50px;padding:14px 42px;
  font-size:1.1rem;font-weight:800;color:#fff;cursor:pointer;letter-spacing:.5px;
  box-shadow:0 6px 28px rgba(255,110,180,.5);
  transition:transform .2s,box-shadow .2s}
.btn-start:hover{transform:translateY(-2px) scale(1.04);
  box-shadow:0 10px 36px rgba(255,110,180,.65)}
.btn-start:active{transform:scale(.97)}
/* GAME SCREEN */
#game{justify-content:flex-start;align-items:stretch;padding:0}
/* TOP BAR */
.top-bar{display:flex;align-items:center;gap:8px;
  padding:10px 14px 8px;height:var(--tb-h);
  background:rgba(0,0,0,.3);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--card-b);flex-shrink:0}
.xp-section{display:flex;flex-direction:column;flex:1;min-width:0}
.xp-top{display:flex;justify-content:space-between;align-items:center;
  font-size:.68rem;opacity:.75;margin-bottom:3px}
.xp-bar-wrap{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.xp-bar-fill{height:100%;width:0%;
  background:linear-gradient(90deg,var(--pur),var(--pink),var(--gold));
  border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.combo-badge{background:rgba(255,110,180,.2);border:1px solid var(--pink);
  border-radius:50px;padding:3px 8px;font-size:.72rem;font-weight:800;
  white-space:nowrap;opacity:0;transition:opacity .3s}
.combo-badge.show{opacity:1;animation:comboPop .4s ease}
@keyframes comboPop{0%{transform:scale(.6)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.btn-finish{background:linear-gradient(135deg,var(--gold2),var(--gold));
  border:none;border-radius:30px;padding:7px 16px;
  font-size:.78rem;font-weight:800;color:#1a0530;cursor:pointer;
  transition:transform .2s;white-space:nowrap;flex-shrink:0}
.btn-finish:hover{transform:scale(1.06)}
.btn-finish:disabled{opacity:.3;cursor:not-allowed}
/* CATEGORY TABS */
.cat-tabs{display:flex;gap:5px;padding:8px 10px 6px;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
  height:var(--tab-h);align-items:center;
  background:rgba(0,0,0,.2);border-bottom:1px solid var(--card-b)}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;display:flex;align-items:center;gap:4px;
  border:1.5px solid var(--card-b);border-radius:50px;padding:4px 10px;
  font-size:.72rem;font-weight:700;cursor:pointer;
  background:var(--card);transition:all .2s;position:relative}
.cat-tab.active{border-color:var(--gold);background:rgba(245,197,24,.12);
  color:var(--gold)}
.cat-tab .tab-dot{width:6px;height:6px;border-radius:50%;
  background:var(--pink);position:absolute;top:3px;right:3px;
  display:none}
.cat-tab .tab-dot.show{display:block}
/* STAGE */
.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;min-height:0}
.mirror-outer{position:relative;padding:8px;
  border-radius:50% / 45%;
  border:6px solid var(--gold);
  box-shadow:0 0 30px rgba(245,197,24,.5),0 0 80px rgba(245,197,24,.2),
             inset 0 0 30px rgba(0,0,0,.5);
  background:rgba(10,0,30,.6);
  max-height:calc(100% - 16px);display:flex;align-items:center;justify-content:center}
.char-wrap{position:relative;cursor:crosshair;
  height:100%;aspect-ratio:280/580}
#char-svg{width:100%;height:100%;display:block}
#brush-canvas{position:absolute;inset:0;pointer-events:none;
  opacity:0;transition:opacity .3s;border-radius:50% / 45%}
#brush-canvas.active{pointer-events:all;opacity:1}
/* Blink animation target */
@keyframes eyeBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.05)}}
.lyr-eyes-blink{transform-origin:center 78px}
@keyframes breathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(.993) translateY(1px)}}
#char-svg{animation:breathe 3.5s ease-in-out infinite;transform-origin:140px 580px}
@keyframes hairSway{0%,100%{transform:skewX(0)}50%{transform:skewX(1.5deg)}}
@keyframes excitedJump{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-16px) rotate(-2deg)}60%{transform:translateY(-8px) rotate(1.5deg)}100%{transform:translateY(0) rotate(0)}}
.char-react{animation:excitedJump .65s ease-out !important}
/* TOOL PANEL */
.tool-panel{height:var(--panel-h);display:flex;align-items:center;gap:10px;
  padding:0 12px;
  background:rgba(0,0,0,.25);border-top:1px solid var(--card-b);
  flex-shrink:0;overflow:hidden}
.panel-icon{font-size:1.7rem;flex-shrink:0}
.panel-info{display:flex;flex-direction:column;min-width:0;flex-shrink:0;max-width:38%}
.panel-name{font-size:.85rem;font-weight:800;line-height:1.2}
.panel-hint{font-size:.65rem;opacity:.65;line-height:1.3}
.panel-opts{flex:1;display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;
  align-items:center;scrollbar-width:none}
.panel-opts::-webkit-scrollbar{display:none}
.opt-pill{flex-shrink:0;border:1.5px solid var(--card-b);border-radius:50px;
  padding:4px 10px;font-size:.7rem;font-weight:700;cursor:pointer;
  background:var(--card);transition:all .2s;white-space:nowrap}
.opt-pill.active{border-color:var(--gold);background:rgba(245,197,24,.15);color:var(--gold)}
.opt-pill.done-tick{border-color:var(--pink);background:rgba(255,110,180,.12);color:var(--pink)}
.color-preview{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  cursor:pointer;flex-shrink:0}
input[type=color]{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.shade-opts{display:flex;gap:6px;align-items:center}
.shade-dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:all .2s;flex-shrink:0}
.shade-dot.active{border-color:var(--gold);transform:scale(1.2);
  box-shadow:0 0 8px var(--gold)}
/* TOOLBAR */
.toolbar{height:var(--bar-h);padding:8px 10px 12px;
  background:rgba(0,0,0,.35);backdrop-filter:blur(12px);
  border-top:1px solid var(--card-b);flex-shrink:0}
.toolbar-scroll{display:flex;gap:8px;height:100%;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  align-items:center}
.toolbar-scroll::-webkit-scrollbar{display:none}
.tool-btn{flex-shrink:0;width:var(--tool-sz);height:var(--tool-sz);
  border-radius:var(--r);border:2px solid transparent;
  background:var(--card);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;transition:all .22s;position:relative}
.tool-btn .t-icon{font-size:1.5rem;line-height:1}
.tool-btn .t-label{font-size:.55rem;font-weight:700;opacity:.8;text-align:center}
.tool-btn.selected{border-color:var(--gold);background:rgba(245,197,24,.12);
  box-shadow:0 0 16px rgba(245,197,24,.4);transform:translateY(-3px) scale(1.04)}
.tool-btn.done{border-color:var(--pink);background:rgba(255,110,180,.1)}
.tool-btn.done::after{content:"✓";position:absolute;top:4px;right:5px;
  font-size:.65rem;color:var(--pink);font-weight:900}
.tool-btn:hover:not(.selected){background:var(--card-b);transform:translateY(-2px)}
/* UNDO BTN */
.btn-undo{position:fixed;bottom:calc(var(--bar-h) + 6px);right:12px;z-index:20;
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--card-b);
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s}
.btn-undo:hover{border-color:var(--gold);transform:scale(1.1)}
/* ZONE HINT */
.zone-hint{position:absolute;background:rgba(255,80,80,.9);color:#fff;
  border-radius:50px;padding:5px 12px;font-size:.72rem;font-weight:800;
  pointer-events:none;animation:floatUp .9s ease-out forwards;
  white-space:nowrap;z-index:30}
/* FLOAT TEXT */
.float-text{position:absolute;font-size:.82rem;font-weight:800;
  color:var(--gold);pointer-events:none;
  animation:floatUp .95s ease-out forwards;
  text-shadow:0 0 8px rgba(245,197,24,.7);z-index:30;white-space:nowrap}
@keyframes floatUp{from{opacity:1;transform:translateX(-50%) translateY(0)}
  to{opacity:0;transform:translateX(-50%) translateY(-65px)}}
/* PARTICLES */
.particle{position:absolute;pointer-events:none;z-index:30;
  animation:particlePop .8s ease-out forwards}
@keyframes particlePop{0%{opacity:1;transform:translate(var(--tx,0),var(--ty,0)) scale(.3) rotate(0deg)}
  60%{opacity:1}100%{opacity:0;transform:translate(var(--tx2,0),var(--tx2,0)) scale(.8) rotate(360deg)}}
.bubble{border-radius:50%;background:rgba(130,200,255,.6);animation:bubbleRise 1s ease-out forwards}
@keyframes bubbleRise{0%{opacity:.9;transform:translate(var(--bx,0),0) scale(1)}
  100%{opacity:0;transform:translate(var(--bx,0),var(--by,-70px)) scale(1.4)}}
/* CAT BANNER */
.cat-banner{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);
  background:linear-gradient(135deg,var(--gold2),var(--pink));
  border-radius:0 0 var(--r) var(--r);padding:8px 24px;
  font-size:.85rem;font-weight:800;color:#fff;z-index:40;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.cat-banner.show{transform:translateX(-50%) translateY(0)}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--bar-h) + 50px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,5,45,.92);backdrop-filter:blur(10px);
  border:1px solid var(--card-b);border-radius:50px;
  padding:9px 22px;font-size:.82rem;font-weight:700;
  opacity:0;transition:all .35s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* FINISH SCREEN */
#finish{gap:0;overflow-y:auto;padding:16px 12px 80px;justify-content:flex-start}
.finish-title{font-family:'Playfair Display',serif;
  font-size:clamp(1.5rem,6vw,2.2rem);
  background:linear-gradient(135deg,var(--gold),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;margin-bottom:4px}
.finish-sub{font-size:.82rem;opacity:.6;text-align:center;margin-bottom:12px}
.ba-row{display:flex;gap:10px;width:100%;max-width:460px;margin-bottom:12px}
.ba-card{flex:1;background:var(--card);border:1px solid var(--card-b);
  border-radius:var(--r);padding:8px;text-align:center}
.ba-card svg{width:100%;height:auto;max-height:220px}
.ba-label{font-size:.7rem;opacity:.6;margin-top:5px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.score-section{text-align:center;margin-bottom:10px}
.score-num{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.score-stars{font-size:1.4rem;letter-spacing:3px;margin:4px 0}
.score-label{font-size:.75rem;opacity:.55}
.cat-scores-grid{display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;width:100%;max-width:400px;margin-bottom:12px}
.cat-score-cell{background:var(--card);border:1px solid var(--card-b);
  border-radius:10px;padding:7px 5px;text-align:center}
.cs-icon{font-size:1.2rem}
.cs-name{font-size:.6rem;opacity:.65;margin:2px 0}
.cs-pct{font-size:.85rem;font-weight:800}
.badges-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  max-width:400px;margin-bottom:12px}
.badge{background:var(--card);border:1px solid var(--card-b);border-radius:50px;
  padding:5px 12px;font-size:.72rem;font-weight:700;
  display:flex;align-items:center;gap:5px}
.finish-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-replay{background:linear-gradient(135deg,var(--pur),var(--pink));
  border:none;border-radius:50px;padding:13px 34px;
  font-size:.95rem;font-weight:800;color:#fff;cursor:pointer;
  box-shadow:0 6px 22px rgba(155,89,182,.4);transition:transform .2s}
.btn-replay:hover{transform:translateY(-2px) scale(1.04)}
/* RESPONSIVE */
@media(max-height:680px){:root{--tool-sz:58px;--panel-h:60px;--bar-h:78px;--tb-h:46px;--tab-h:38px}}
@media(max-height:580px){:root{--tool-sz:52px;--panel-h:52px;--bar-h:68px}}
</style>
</head>
<body>
<canvas id="stars-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>
<div class="bulb-wrap" id="bulb-wrap"></div>
<div class="cat-banner" id="cat-banner"></div>
<div class="toast" id="toast"></div>

<!-- INTRO SCREEN -->
<div id="intro" class="screen">
  <div class="game-title">✨ Glam Makeover<br/>Studio</div>
  <div class="game-sub">Transform the messy girl into a glam queen!</div>
  <svg class="intro-char" id="intro-svg" viewBox="0 0 280 580" xmlns="http://www.w3.org/2000/svg"></svg>
  <button class="btn-start" onclick="startGame()">💄 Start Makeover!</button>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen hidden">
  <div class="top-bar">
    <div class="xp-section">
      <div class="xp-top">
        <span id="xp-level">Glam Lv.1</span>
        <span id="xp-val">0 XP</span>
      </div>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-fill"></div></div>
    </div>
    <div class="combo-badge" id="combo-badge">🔥 x1</div>
    <button class="btn-finish" id="btn-finish" onclick="showFinish()" disabled>Finish!</button>
  </div>
  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="stage-wrap" id="stage-wrap">
    <div class="mirror-outer" id="mirror-outer">
      <div class="char-wrap" id="char-wrap">
        <svg id="char-svg" viewBox="0 0 280 580" xmlns="http://www.w3.org/2000/svg"></svg>
        <canvas id="brush-canvas" width="280" height="580"></canvas>
      </div>
    </div>
  </div>
  <div class="tool-panel" id="tool-panel">
    <div class="panel-icon" id="panel-icon">👆</div>
    <div class="panel-info">
      <div class="panel-name" id="panel-name">Select a tool</div>
      <div class="panel-hint" id="panel-hint">Pick a category tab and tap a tool</div>
    </div>
    <div class="panel-opts" id="panel-opts"></div>
  </div>
  <div class="toolbar">
    <div class="toolbar-scroll" id="toolbar-scroll"></div>
  </div>
  <button class="btn-undo" onclick="undoLast()" title="Undo">↩</button>
</div>

<!-- FINISH SCREEN -->
<div id="finish" class="screen hidden">
  <div class="finish-title">Makeover Complete! 🎉</div>
  <div class="finish-sub">Look at this stunning transformation!</div>
  <div class="ba-row">
    <div class="ba-card">
      <svg viewBox="0 0 280 580" xmlns="http://www.w3.org/2000/svg" id="before-svg"></svg>
      <div class="ba-label">Before</div>
    </div>
    <div class="ba-card">
      <svg viewBox="0 0 280 580" xmlns="http://www.w3.org/2000/svg" id="after-svg"></svg>
      <div class="ba-label">After ✨</div>
    </div>
  </div>
  <div class="score-section">
    <div class="score-num" id="score-num">0%</div>
    <div class="score-stars" id="score-stars"></div>
    <div class="score-label">Glam Score</div>
  </div>
  <div class="cat-scores-grid" id="cat-scores-grid"></div>
  <div class="badges-row" id="badges-row"></div>
  <div class="finish-btns">
    <button class="btn-replay" onclick="resetGame()">🔄 Play Again</button>
  </div>
</div>

<script>
/* ============================
   CONSTANTS & STATE
============================ */
const SKIN = {
  default:{m:'#d4956a',s:'#b87448',d:'#9b5830'},
  fair:   {m:'#ffe0cc',s:'#f5b89c',d:'#e8a078'},
  medium: {m:'#f0b98c',s:'#d4956a',d:'#c07848'},
  tan:    {m:'#c87941',s:'#a05828',d:'#8b4518'},
};

const TOOL_CATEGORIES = [
  {id:'skincare', label:'Skincare', icon:'🧴'},
  {id:'face',     label:'Face',     icon:'💄'},
  {id:'eyes',     label:'Eyes',     icon:'👁️'},
  {id:'lips',     label:'Lips',     icon:'💋'},
  {id:'hair',     label:'Hair',     icon:'💇'},
  {id:'body',     label:'Body',     icon:'💅'},
];

const TOOLS = [
  // SKINCARE
  {id:'face-wash', cat:'skincare', icon:'🧼', label:'Face Wash', hint:'Tap face 3× to cleanse',
   zones:['face'], steps:3, stateKey:'facewash', progKey:'faceWashProg',
   msgs:['Cleansing... 🧼','Almost clean!','Fresh & clean! ✨'], particle:'bubbles', xp:10},
  {id:'toner', cat:'skincare', icon:'💧', label:'Toner', hint:'Tap face to tone',
   zones:['face'], steps:1, stateKey:'toner',
   msgs:['Pores tightened! 💧'], particle:'droplets', xp:8},
  {id:'moisturizer', cat:'skincare', icon:'🫧', label:'Moisturize', hint:'Tap face to moisturize',
   zones:['face'], steps:1, stateKey:'moisturizer',
   msgs:['Dewy glow! 🫧'], particle:'glow', xp:8},
  {id:'face-mask', cat:'skincare', icon:'🎭', label:'Face Mask', hint:'Tap face to apply mask',
   zones:['face'], steps:1, stateKey:'faceMask',
   msgs:['Mask on! ✨'], particle:'sparkles', xp:12},
  // FACE
  {id:'foundation', cat:'face', icon:'✨', label:'Foundation', hint:'Pick shade, then tap face',
   zones:['face'], steps:1, stateKey:'foundation', colorType:'shade',
   msgs:['Flawless base! ✨'], particle:'shimmer', xp:15},
  {id:'concealer', cat:'face', icon:'🪄', label:'Concealer', hint:'Tap face to conceal',
   zones:['face'], steps:1, stateKey:'concealer',
   msgs:['Hidden! 🪄'], particle:'glow', xp:10},
  {id:'contour', cat:'face', icon:'🌑', label:'Contour', hint:'Tap cheeks to contour',
   zones:['face'], steps:1, stateKey:'contour',
   msgs:['Sculpted! 🌑'], particle:'shimmer', xp:12},
  {id:'highlight', cat:'face', icon:'⚡', label:'Highlight', hint:'Tap cheekbones to highlight',
   zones:['face'], steps:1, stateKey:'highlight',
   msgs:['Blinding glow! ⚡'], particle:'stars', xp:12},
  {id:'blush', cat:'face', icon:'🌸', label:'Blush', hint:'Pick color, then tap cheeks',
   zones:['face'], steps:1, stateKey:'blushDone', colorKey:'blushColor',
   msgs:['So rosy! 🌸'], particle:'petals', xp:10},
  {id:'bronzer', cat:'face', icon:'🌅', label:'Bronzer', hint:'Tap forehead to bronze',
   zones:['face'], steps:1, stateKey:'bronzer',
   msgs:['Sun-kissed! 🌅'], particle:'shimmer', xp:10},

function darkenColor(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n>>16) - Math.round(((n>>16))*amount)));
  const g = Math.max(0, Math.min(255, ((n>>8)&0xff) - Math.round((((n>>8)&0xff))*amount)));
  const b = Math.max(0, Math.min(255, (n&0xff) - Math.round(((n&0xff))*amount)));
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function renderChar() {
  document.getElementById('char-svg').innerHTML = buildCharSVG(STATE);
  startIdleAnimations();
}
function renderIntro() {
  const s = {...STATE, foundation:false, skinTone:'default', facewash:false};
  document.getElementById('intro-svg').innerHTML = buildCharSVG(s);
}

/* ============================
   ZONE DETECTION
============================ */
function clientToSVG(cx, cy, svgEl) {
  const r = svgEl.getBoundingClientRect();
  return { x: (cx - r.left) * 280 / r.width, y: (cy - r.top) * 580 / r.height };
}
function detectZone(sx, sy) {
  // Hair ellipse
  const dx1 = sx-140, dy1 = sy-55;
  if (dx1*dx1/4225 + dy1*dy1/4225 < 1 && sy < 110) return 'hair';
  // Face ellipse (slightly enlarged for tap ease)
  const dx2 = sx-140, dy2 = sy-88;
  if (dy2 > -62 && dx2*dx2/3136 + dy2*dy2/4356 < 1) return 'face';
  // Hands
  if (sx>=25&&sx<=72&&sy>=374&&sy<=430) return 'hands';
  if (sx>=208&&sx<=255&&sy>=374&&sy<=430) return 'hands';
  // Feet
  if (sy>=548&&sy<=582&&sx>=70&&sx<=120) return 'feet';
  if (sy>=548&&sy<=582&&sx>=140&&sx<=195) return 'feet';
  // Body
  if (sx>=60&&sx<=220&&sy>=182&&sy<=358) return 'body';
  return null;
}
function toolAcceptsZone(tool, zone) {
  if (!zone) return false;
  if (tool.zones.includes('face') && zone === 'face') return true;
  if (tool.zones.includes('hair') && zone === 'hair') return true;
  if (tool.zones.includes('body') && zone === 'body') return true;
  if (tool.zones.includes('hands') && zone === 'hands') return true;
  if (tool.zones.includes('feet') && zone === 'feet') return true;
  // Permissive tools (outfit, earrings, necklace, crown) accept any zone
  if (tool.zones.length > 2 && zone) return true;
  return false;
}

/* ============================
   CHARACTER TAP HANDLER
============================ */
function handleCharTap(e) {
  e.preventDefault();
  if (!activeTool) { showToast('👆 Pick a tool first!'); return; }
  const svgEl = document.getElementById('char-svg');
  let cx, cy;
  if (e.touches) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  const sv = clientToSVG(cx, cy, svgEl);
  const zone = detectZone(sv.x, sv.y);

  // Stage coords for particles
  const stageEl = document.getElementById('stage-wrap');
  const sr = stageEl.getBoundingClientRect();
  const stageX = cx - sr.left;
  const stageY = cy - sr.top;

  if (!toolAcceptsZone(activeTool, zone)) {
    const correct = activeTool.zones[0];
    spawnZoneHint(correct, stageX, stageY);
    triggerShake();
    return;
  }
  handleToolStep(activeTool, zone, sv.x, sv.y, stageX, stageY);
}

function triggerShake() {
  const wrap = document.getElementById('char-wrap');
  wrap.style.animation = 'none';
  requestAnimationFrame(() => {
    wrap.style.animation = 'excitedJump .3s ease';
    setTimeout(() => { wrap.style.animation = ''; }, 400);
  });
}

/* ============================
   TOOL STEP HANDLER
============================ */
function handleToolStep(tool, zone, svgX, svgY, stageX, stageY) {
  // Multi-step tools
  if (tool.steps > 1) {
    if (tool.progKey) {
      // 3-tap tools
      const prog = STATE[tool.progKey];
      if (prog < 3) {
        STATE[tool.progKey] = prog + 1;
        spawnParticles(tool.particle, stageX, stageY, 6);
        spawnFloatText(tool.msgs[Math.min(prog, tool.msgs.length-1)], stageX, stageY);
        renderChar();
        if (STATE[tool.progKey] >= 3) {
          finishTool(tool, stageX, stageY);
        }
        return;
      }
      // Already done — treat as refresh
      finishTool(tool, stageX, stageY);
      return;
    }
    if (tool.stateKeys) {
      // 2-tap tools (mascara, nails)
      const [k1, k2] = tool.stateKeys;
      const fk = tool.finalKey || null;
      if (!STATE[k1]) {
        STATE[k1] = true;
        spawnParticles(tool.particle, stageX, stageY, 6);
        spawnFloatText(tool.msgs[0], stageX, stageY);
        renderChar();
        triggerReaction();
        return;
      } else if (!STATE[k2]) {
        STATE[k2] = true;
        if (fk) STATE[fk] = true;
        spawnParticles(tool.particle, stageX, stageY, 10);
        spawnFloatText(tool.msgs[1], stageX, stageY);
        renderChar();
        finishTool(tool, stageX, stageY);
        return;
      }
      // Both done
      finishTool(tool, stageX, stageY);
      return;
    }
  }
  // Single-step tools
  finishTool(tool, stageX, stageY);
}

function finishTool(tool, stageX, stageY) {
  // Mark state
  if (tool.stateKey) STATE[tool.stateKey] = true;
  if (tool.progKey) STATE[tool.progKey] = 3;
  if (tool.stateKeys) tool.stateKeys.forEach(k => STATE[k] = true);
  if (tool.finalKey) STATE[tool.finalKey] = true;

  const wasNew = !applied.has(tool.id);
  if (wasNew) {
    // Record for undo
    undoStack.push({toolId: tool.id, stateSnapshot: captureState()});
    applied.add(tool.id);
    awardXP(tool.xp);
    checkCombo(tool);
    checkCategoryComplete(tool.cat);
    updateCatDots();
    updateProgress();
  }

  renderChar();
  spawnParticles(tool.particle, stageX, stageY, wasNew ? 12 : 6);
  spawnFloatText(tool.msgs[tool.msgs.length-1], stageX, stageY);
  triggerReaction();

  // Mark btn done
  const btn = document.getElementById('tbtn-' + tool.id);
  if (btn) { btn.classList.add('done'); btn.classList.remove('selected'); }

  if (applied.size >= 5) {
    document.getElementById('btn-finish').disabled = false;
  }
}

/* ============================
   STATE CAPTURE / UNDO
============================ */
function captureState() {
  return JSON.parse(JSON.stringify(STATE));
}
function undoLast() {
  if (undoStack.length === 0) { showToast('Nothing to undo!'); return; }
  const {toolId, stateSnapshot} = undoStack.pop();
  applied.delete(toolId);
  Object.assign(STATE, stateSnapshot);
  renderChar();
  buildToolbar(activeCat);
  updateCatDots();
  updateProgress();
  showToast('↩ ' + toolId + ' undone');
}

/* ============================
   GAMIFICATION
============================ */
const XP_LEVELS = [0, 50, 120, 220, 350, 520];
function awardXP(amount) {
  const bonus = STATE.combo >= 5 ? 10 : (STATE.combo >= 3 ? 5 : 0);
  const total = amount + bonus;
  STATE.xp += total;
  updateXPBar();
  // Check level up
  const level = getLevel();
  if (level > getLevel(STATE.xp - total)) {
    showToast(`✨ Glam Level ${level}! +${total} XP`);
  }
}
function getLevel(xpVal) {
  const xp = xpVal !== undefined ? xpVal : STATE.xp;
  for (let i = XP_LEVELS.length - 1; i >= 0; i--) {
    if (xp >= XP_LEVELS[i]) return i + 1;
  }
  return 1;
}
function updateXPBar() {
  const level = getLevel();
  const cur = XP_LEVELS[level-1] || 0;
  const next = XP_LEVELS[level] || XP_LEVELS[XP_LEVELS.length-1];
  const pct = Math.min(100, ((STATE.xp - cur) / (next - cur)) * 100);
  document.getElementById('xp-fill').style.width = pct + '%';
  document.getElementById('xp-level').textContent = 'Glam Lv.' + level;
  document.getElementById('xp-val').textContent = STATE.xp + ' XP';
}
function checkCombo(tool) {
  const now = Date.now();
  if (now - STATE.lastToolTime < 8000) {
    STATE.combo++;
  } else {
    STATE.combo = 1;
  }
  STATE.lastToolTime = now;
  const badge = document.getElementById('combo-badge');
  badge.textContent = '🔥 x' + STATE.combo;
  if (STATE.combo >= 3) {
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 2500);
  }
}
function checkCategoryComplete(catId) {
  const def = CAT_SCORE_DEF[catId];
  if (!def) return;
  const allDone = def.tools.every(t => applied.has(t));
  if (!allDone) return;
  awardXP(50);
  showCategoryBanner(TOOL_CATEGORIES.find(c=>c.id===catId));
}
function showCategoryBanner(cat) {
  const banner = document.getElementById('cat-banner');
  banner.textContent = `${cat.icon} ${cat.label} Category Mastered! +50 XP`;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 2800);
}
function updateCatDots() {
  Object.entries(CAT_SCORE_DEF).forEach(([catId, def]) => {
    const dot = document.getElementById('dot-' + catId);
    if (!dot) return;
    const done = def.tools.filter(t => applied.has(t)).length;
    dot.classList.toggle('show', done > 0);
  });
}
function updateProgress() {
  updateXPBar();
  updateCatDots();
  if (applied.size >= 5) document.getElementById('btn-finish').disabled = false;
}

/* ============================
   SCORING
============================ */
function calcScore() {
  let score = 0;
  for (const [cat, cfg] of Object.entries(CAT_SCORE_DEF)) {
    const done = cfg.tools.filter(t => applied.has(t)).length;
    score += (done / cfg.tools.length) * cfg.weight;
  }
  if (applied.has('foundation') && applied.has('setting-spray')) score += 3;
  if (['lip-liner','lipstick','lip-gloss'].every(t => applied.has(t))) score += 3;
  if (['eyebrow','eyeshadow','eyeliner','mascara'].every(t => applied.has(t))) score += 4;
  return Math.round(Math.min(100, score));
}
function getBadges() {
  const badges = [];
  const score = calcScore();
  if (score >= 90) badges.push({icon:'👑', label:'Glam Queen'});
  if (applied.size >= TOOLS.length) badges.push({icon:'🌟', label:'Full Glam'});
  const skincareDone = CAT_SCORE_DEF.skincare.tools.every(t => applied.has(t));
  const faceDoneFirst = applied.has('foundation');
  if (skincareDone) badges.push({icon:'🧴', label:'Skincare First'});
  if (STATE.nailHandsDone && STATE.nailFeetDone) badges.push({icon:'💅', label:'Head to Toe'});
  const colorPickers = ['blushColor','eyeShadowColor','lipColor','hairColor','nailColorHands','nailColorFeet'];
  const usedPickers = colorPickers.filter(k => {
    const defaults = {blushColor:'#ff9999',eyeShadowColor:'#9b59b6',lipColor:'#e8003c',hairColor:'#3d1a00',nailColorHands:'#ff4488',nailColorFeet:'#ff4488'};
    return STATE[k] !== defaults[k];
  }).length;
  if (usedPickers >= 3) badges.push({icon:'🎨', label:'Color Queen'});
  if (STATE.combo >= 5) badges.push({icon:'🔥', label:'Combo Master'});
  return badges;
}

/* ============================
   CHAR EVENTS SETUP
============================ */
function setupCharEvents() {
  const wrap = document.getElementById('char-wrap');
  wrap.replaceWith(wrap.cloneNode(true)); // remove old listeners
  const newWrap = document.getElementById('char-wrap');
  newWrap.addEventListener('click', handleCharTap);
  newWrap.addEventListener('touchstart', handleCharTap, {passive:false});
}

/* ============================
   CONFETTI
============================ */
function launchConfetti() {
  const c = document.getElementById('confetti-canvas');
  c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d');
  const colors = ['#f5c518','#ff6eb4','#9b59b6','#fff','#ff4444','#44ff88','#4488ff'];
  const pieces = [];
  for (let i = 0; i < 200; i++) {
    pieces.push({
      x: Math.random()*c.width, y: Math.random()*c.height - c.height,
      r: Math.random()*6+3, color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360, vx: (Math.random()-.5)*4,
      vy: Math.random()*5+2, vr: Math.random()*8-4,
    });
  }
  let frame = 0;
  function drawConf() {
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p => {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color; ctx.beginPath();
      ctx.rect(-p.r/2,-p.r/2,p.r,p.r); ctx.fill(); ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += .12;
    });
    frame++;
    if (frame < 200) requestAnimationFrame(drawConf);
    else ctx.clearRect(0,0,c.width,c.height);
  }
  drawConf();
}

/* ============================
   STARS BACKGROUND
============================ */
(function() {
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    stars = [];
    const n = Math.floor((c.width*c.height)/3500);
    for (let i=0;i<n;i++) stars.push({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.5+.3, phase:Math.random()*Math.PI*2, speed:Math.random()*.004+.001
    });
  }
  function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s => {
      s.phase += s.speed;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${(Math.sin(s.phase)*.5+.5)*.8})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

/* ============================
   LIGHT BULBS
============================ */
function initBulbs() {
  const wrap = document.getElementById('bulb-wrap');
  const W = innerWidth, H = innerHeight;
  // Top row: 12 bulbs
  for (let i=0;i<12;i++) {
    const b = document.createElement('div');
    b.className='bulb';
    b.style.cssText=`left:${(i+.5)*(W/12)-9}px;top:4px`;
    wrap.appendChild(b);
  }
  // Bottom row: 12 bulbs
  for (let i=0;i<12;i++) {
    const b = document.createElement('div');
    b.className='bulb';
    b.style.cssText=`left:${(i+.5)*(W/12)-9}px;bottom:4px`;
    wrap.appendChild(b);
  }
  // Left column: 5 bulbs
  for (let i=0;i<5;i++) {
    const b = document.createElement('div');
    b.className='bulb';
    b.style.cssText=`left:4px;top:${(i+.5)*(H/5)-9}px`;
    wrap.appendChild(b);
  }
  // Right column: 5 bulbs
  for (let i=0;i<5;i++) {
    const b = document.createElement('div');
    b.className='bulb';
    b.style.cssText=`right:4px;top:${(i+.5)*(H/5)-9}px`;
    wrap.appendChild(b);
  }
}

/* ============================
   INIT
============================ */
initBulbs();
renderIntro();
