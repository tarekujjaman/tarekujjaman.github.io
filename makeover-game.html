<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Glam Makeover Game ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #1a0530;
      --bg2:      #2d0a4e;
      --gold:     #f5c518;
      --gold2:    #e8a000;
      --pink:     #ff6eb4;
      --purple:   #9b59b6;
      --text:     #fff;
      --card:     rgba(255,255,255,0.08);
      --card-b:   rgba(255,255,255,0.15);
      --radius:   18px;
      --tool-sz:  72px;
    }
    html, body {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, var(--bg) 0%, var(--bg2) 100%);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    /* ===== SCREENS ===== */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity .45s ease, transform .45s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(.97); }

    /* ===== STARS BG ===== */
    #stars-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ===== INTRO SCREEN ===== */
    #intro { z-index: 10; gap: 20px; padding: 24px; text-align: center; }
    .game-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold) 0%, var(--pink) 60%, #b388ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1.1; margin-bottom: 6px;
    }
    .game-subtitle { font-size: clamp(.85rem, 3vw, 1.1rem); opacity: .7; margin-bottom: 10px; }

    .intro-character { width: min(220px, 55vw); margin: 0 auto 10px; filter: drop-shadow(0 8px 24px rgba(255,110,180,.35)); }

    .btn-start {
      background: linear-gradient(135deg, var(--pink), var(--gold));
      border: none; border-radius: 50px; padding: 16px 44px;
      font-size: 1.15rem; font-weight: 800; color: #fff;
      cursor: pointer; letter-spacing: .5px;
      box-shadow: 0 6px 30px rgba(255,110,180,.45);
      transition: transform .2s, box-shadow .2s;
    }
    .btn-start:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 36px rgba(255,110,180,.6); }
    .btn-start:active { transform: scale(.97); }

    /* ===== GAME SCREEN ===== */
    #game { z-index: 10; flex-direction: column; padding: 0; justify-content: flex-start; }

    /* Top bar */
    .top-bar {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 8px;
      background: rgba(0,0,0,.25); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-b);
    }
    .top-bar h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; }
    .top-bar .progress-wrap { flex: 1; margin: 0 14px; }
    .progress-label { font-size: .7rem; opacity: .6; margin-bottom: 4px; }
    .progress-bar {
      height: 8px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--pink), var(--gold));
      border-radius: 99px;
      transition: width .55s cubic-bezier(.4,0,.2,1);
    }
    .btn-finish {
      background: linear-gradient(135deg, var(--gold2), var(--gold));
      border: none; border-radius: 30px; padding: 8px 18px;
      font-size: .8rem; font-weight: 800; color: #1a0530; cursor: pointer;
      transition: transform .2s; white-space: nowrap;
    }
    .btn-finish:hover { transform: scale(1.06); }
    .btn-finish:disabled { opacity: .35; cursor: not-allowed; }

    /* Character stage */
    .stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; width: 100%;
    }
    .character-wrap {
      position: relative; width: min(300px, 78vw);
      filter: drop-shadow(0 12px 36px rgba(155,89,182,.45));
      cursor: crosshair;
    }
    #char-svg { width: 100%; height: auto; display: block; }

    /* Click ripple */
    .ripple {
      position: absolute; border-radius: 50%;
      width: 40px; height: 40px;
      background: radial-gradient(circle, rgba(255,255,255,.5) 0%, transparent 70%);
      animation: rippleAnim .6s ease-out forwards;
      pointer-events: none; transform: translate(-50%, -50%);
    }
    @keyframes rippleAnim {
      from { opacity: 1; transform: translate(-50%,-50%) scale(.3); }
      to   { opacity: 0; transform: translate(-50%,-50%) scale(2.5); }
    }

    /* Floating text */
    .float-text {
      position: absolute; font-size: .85rem; font-weight: 800;
      color: var(--gold); pointer-events: none;
      animation: floatUp .9s ease-out forwards;
      text-shadow: 0 0 8px rgba(245,197,24,.7);
    }
    @keyframes floatUp {
      from { opacity: 1; transform: translateY(0) translateX(-50%); }
      to   { opacity: 0; transform: translateY(-60px) translateX(-50%); }
    }

    /* Sparkles */
    .sparkle {
      position: absolute; pointer-events: none;
      animation: sparklePop .7s ease-out forwards;
      font-size: 1.2rem;
    }
    @keyframes sparklePop {
      0%   { opacity: 1; transform: scale(.3) rotate(0deg); }
      60%  { opacity: 1; transform: scale(1.4) rotate(180deg); }
      100% { opacity: 0; transform: scale(.8) rotate(360deg); }
    }

    /* Tool status */
    .tool-status {
      text-align: center; padding: 6px 14px;
      font-size: .82rem; font-weight: 700;
      background: rgba(255,255,255,.06); border-top: 1px solid var(--card-b);
      min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .tool-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }

    /* Toolbar */
    .toolbar {
      width: 100%; padding: 10px 12px 14px;
      background: rgba(0,0,0,.35); backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-b);
    }
    .toolbar-scroll {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .toolbar-scroll::-webkit-scrollbar { display: none; }

    .tool-btn {
      flex-shrink: 0;
      width: var(--tool-sz); height: var(--tool-sz);
      border-radius: var(--radius); border: 2px solid transparent;
      background: var(--card); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; transition: all .22s ease; position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .tool-btn .tool-icon { font-size: 1.6rem; line-height: 1; }
    .tool-btn .tool-label { font-size: .58rem; font-weight: 700; opacity: .8; text-align: center; }
    .tool-btn.active {
      border-color: var(--gold); background: rgba(245,197,24,.15);
      box-shadow: 0 0 18px rgba(245,197,24,.4);
      transform: translateY(-4px) scale(1.06);
    }
    .tool-btn.done { border-color: var(--pink); background: rgba(255,110,180,.12); }
    .tool-btn.done::after {
      content: '✓'; position: absolute; top: 5px; right: 7px;
      font-size: .7rem; color: var(--pink); font-weight: 900;
    }
    .tool-btn:hover:not(.active) { background: var(--card-b); transform: translateY(-2px); }

    /* Color picker inside tool */
    .color-swatch {
      width: 18px; height: 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,.3);
      margin-top: -2px;
    }
    input[type="color"] {
      position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;
    }

    /* ===== FINISH SCREEN ===== */
    #finish { z-index: 10; gap: 0; padding: 20px; overflow-y: auto; }
    .finish-title {
      font-family: 'Playfair Display', serif; font-size: clamp(1.6rem,6vw,2.4rem);
      background: linear-gradient(135deg, var(--gold), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px; text-align: center;
    }
    .finish-subtitle { font-size: .88rem; opacity: .65; margin-bottom: 16px; text-align: center; }
    .before-after {
      display: flex; gap: 14px; width: 100%; max-width: 480px;
      margin-bottom: 14px;
    }
    .ba-card {
      flex: 1; background: var(--card); border-radius: var(--radius); padding: 10px;
      text-align: center; border: 1px solid var(--card-b);
    }
    .ba-card svg { width: 100%; height: auto; }
    .ba-label { font-size: .75rem; font-weight: 700; margin-top: 8px; opacity: .7; letter-spacing: .5px; text-transform: uppercase; }

    .glam-score { text-align: center; margin-bottom: 14px; }
    .glam-score .score-num {
      font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 900;
      background: linear-gradient(135deg, var(--gold), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .glam-score .stars { font-size: 1.5rem; letter-spacing: 4px; }
    .glam-score .score-label { font-size: .8rem; opacity: .6; margin-top: 2px; }

    .finish-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-replay {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none; border-radius: 50px; padding: 14px 36px;
      font-size: 1rem; font-weight: 800; color: #fff; cursor: pointer;
      box-shadow: 0 6px 24px rgba(155,89,182,.4);
      transition: transform .2s, box-shadow .2s;
    }
    .btn-replay:hover { transform: translateY(-2px) scale(1.04); }

    /* ===== CONFETTI ===== */
    #confetti-canvas { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(30,10,60,.9); backdrop-filter: blur(10px);
      border: 1px solid var(--card-b); border-radius: 50px;
      padding: 10px 24px; font-size: .85rem; font-weight: 700;
      opacity: 0; transition: all .35s ease; z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== UTILITY ===== */
    @media (max-height: 600px) {
      :root { --tool-sz: 58px; }
      .tool-btn .tool-icon { font-size: 1.3rem; }
      .top-bar { padding: 8px 14px 6px; }
    }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<!-- ===== INTRO ===== -->
<div id="intro" class="screen">
  <div class="game-title">Glam Makeover</div>
  <div class="game-subtitle">Transform the messy girl into a glam queen! ✨</div>
  <svg class="intro-character" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
    <!-- messy preview in intro -->
    <g id="intro-char"></g>
  </svg>
  <button class="btn-start" onclick="startGame()">💄 Start Makeover!</button>
</div>

<!-- ===== GAME ===== -->
<div id="game" class="screen hidden">
  <div class="top-bar">
    <h2>✨ Makeover</h2>
    <div class="progress-wrap">
      <div class="progress-label">Glam Progress</div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
    <button class="btn-finish" id="btn-finish" onclick="showFinish()" disabled>Finish!</button>
  </div>

  <div class="stage" id="stage">
    <div class="character-wrap" id="char-wrap">
      <svg id="char-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <!-- layers populated by JS -->
      </svg>
    </div>
  </div>

  <div class="tool-status" id="tool-status">👆 Select a tool below to begin</div>

  <div class="toolbar">
    <div class="toolbar-scroll" id="toolbar"></div>
  </div>
</div>

<!-- ===== FINISH ===== -->
<div id="finish" class="screen hidden">
  <div class="finish-title">Makeover Complete! 🎉</div>
  <div class="finish-subtitle">Look at this stunning transformation!</div>
  <div class="before-after">
    <div class="ba-card">
      <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" id="before-svg"></svg>
      <div class="ba-label">Before</div>
    </div>
    <div class="ba-card">
      <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" id="after-svg"></svg>
      <div class="ba-label">After</div>
    </div>
  </div>
  <div class="glam-score">
    <div class="score-num" id="score-num">0</div>
    <div class="stars" id="score-stars"></div>
    <div class="score-label">Glam Score</div>
  </div>
  <div class="finish-btns">
    <button class="btn-replay" onclick="resetGame()">🔄 Play Again</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =============================================
   STARS BACKGROUND
============================================= */
(function(){
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width=innerWidth; c.height=innerHeight; initStars(); }
  function initStars(){
    stars=[];
    const n = Math.floor((innerWidth*innerHeight)/3200);
    for(let i=0;i<n;i++) stars.push({ x:Math.random()*c.width, y:Math.random()*c.height, r:Math.random()*1.6+.2, a:Math.random(), speed:Math.random()*.004+.001 });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.a += s.speed; if(s.a>1) s.a=0;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${Math.abs(Math.sin(s.a*Math.PI))*.8})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize(); draw();
})();

/* =============================================
   SVG CHARACTER BUILDER
============================================= */
const STATE = {
  foundation: false,
  blush:      false,
  lipColor:   '#e8003c',
  lipDone:    false,
  eyeShadowColor: '#9b59b6',
  eyeShadowDone: false,
  mascara:    false,
  hairBrush:  false,
  hairColor:  '#3d1a00',
  hairColorDone: false,
  accessories: false,
};

function buildCharSVG(state, messy=true) {
  const skin   = state.foundation ? '#f5c8a0' : '#d4956a';
  const skinSh = state.foundation ? '#e8aa7a' : '#b8734a';
  const lip    = state.lipDone    ? state.lipColor : '#8b4046';
  const esh    = state.eyeShadowDone ? state.eyeShadowColor : 'transparent';
  const lash   = state.mascara ? '#000' : '#3d2010';
  const lashW  = state.mascara ? 2.5 : 1.2;
  const hairC  = state.hairColorDone ? state.hairColor : '#3d1a00';
  const blushO = state.blush ? '.45' : '0';

  // Hair shape depends on brushed or not
  let hairPath, messyStrands='';
  if (state.hairBrush) {
    // Smooth hair
    hairPath = `M100 20 C60 15, 20 40, 22 90 C22 110, 28 125, 34 138
                C38 145, 32 160, 32 178 C32 195, 50 210, 100 215
                C150 210, 168 195, 168 178 C168 160, 162 145, 166 138
                C172 125, 178 110, 178 90 C180 40, 140 15, 100 20Z`;
  } else {
    // Messy hair
    hairPath = `M100 22 C75 10, 30 25, 25 65 C20 95, 25 115, 30 135
                C34 145, 28 162, 30 178 C32 195, 50 210, 100 215
                C150 210, 168 195, 170 178 C172 162, 166 145, 170 135
                C175 115, 180 95, 175 65 C170 25, 125 10, 100 22Z`;
    // Frizzy strands
    messyStrands = `
      <line x1="60" y1="22" x2="45" y2="2" stroke="${hairC}" stroke-width="3" stroke-linecap="round"/>
      <line x1="80" y1="15" x2="72" y2="-4" stroke="${hairC}" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="120" y1="15" x2="128" y2="-4" stroke="${hairC}" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="140" y1="22" x2="156" y2="2" stroke="${hairC}" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="35" x2="32" y2="20" stroke="${hairC}" stroke-width="2" stroke-linecap="round"/>
      <line x1="150" y1="35" x2="168" y2="20" stroke="${hairC}" stroke-width="2" stroke-linecap="round"/>
      <line x1="100" y1="18" x2="96" y2="0" stroke="${hairC}" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="88" y1="16" x2="82" y2="-1" stroke="${hairC}" stroke-width="2" stroke-linecap="round"/>
    `;
  }

  // Earrings
  const earrings = state.accessories ? `
    <circle cx="25" cy="142" r="5" fill="#f5c518" stroke="#e8a000" stroke-width="1"/>
    <circle cx="25" cy="150" r="3.5" fill="#ff6eb4"/>
    <circle cx="175" cy="142" r="5" fill="#f5c518" stroke="#e8a000" stroke-width="1"/>
    <circle cx="175" cy="150" r="3.5" fill="#ff6eb4"/>
    <line x1="25" y1="137" x2="25" y2="142" stroke="#f5c518" stroke-width="2"/>
    <line x1="175" y1="137" x2="175" y2="142" stroke="#f5c518" stroke-width="2"/>
  ` : '';

  // Necklace
  const necklace = state.accessories ? `
    <path d="M60 210 Q100 228 140 210" fill="none" stroke="#f5c518" stroke-width="2.5"/>
    <circle cx="100" cy="222" r="5" fill="#f5c518"/>
    <circle cx="100" cy="222" r="3" fill="#ff6eb4"/>
    <circle cx="80" cy="218" r="3" fill="#f5c518"/>
    <circle cx="120" cy="218" r="3" fill="#f5c518"/>
  ` : '';

  // Foundation glow
  const glow = state.foundation ? `<ellipse cx="100" cy="130" rx="62" ry="72" fill="url(#foundGlow)" opacity=".18"/>` : '';

  return `
    <defs>
      <radialGradient id="skinGrad" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="${skin}"/>
        <stop offset="100%" stop-color="${skinSh}"/>
      </radialGradient>
      <radialGradient id="foundGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe0b2" stop-opacity="1"/>
        <stop offset="100%" stop-color="#ffe0b2" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blushL" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9999" stop-opacity="${blushO}"/>
        <stop offset="100%" stop-color="#ff9999" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blushR" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9999" stop-opacity="${blushO}"/>
        <stop offset="100%" stop-color="#ff9999" stop-opacity="0"/>
      </radialGradient>
      <filter id="softBlur"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="glow2"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    </defs>

    <!-- NECK -->
    <rect x="84" y="198" width="32" height="28" rx="6" fill="${skin}"/>

    <!-- HAIR BACK -->
    <path d="${hairPath}" fill="${hairC}" opacity=".95"/>
    ${messyStrands}

    <!-- HEAD / FACE -->
    <ellipse cx="100" cy="130" rx="62" ry="72" fill="url(#skinGrad)"/>
    ${glow}

    <!-- BLUSH -->
    <ellipse cx="66" cy="148" rx="20" ry="14" fill="url(#blushL)" filter="url(#softBlur)"/>
    <ellipse cx="134" cy="148" rx="20" ry="14" fill="url(#blushR)" filter="url(#softBlur)"/>

    <!-- EYE SHADOW -->
    <ellipse cx="76" cy="116" rx="16" ry="9" fill="${esh}" opacity=".55"/>
    <ellipse cx="124" cy="116" rx="16" ry="9" fill="${esh}" opacity=".55"/>

    <!-- EYEBROWS -->
    <path d="M58 108 Q76 102 94 107" fill="none" stroke="#3d1a00" stroke-width="${state.mascara?3:2}" stroke-linecap="round"/>
    <path d="M106 107 Q124 102 142 108" fill="none" stroke="#3d1a00" stroke-width="${state.mascara?3:2}" stroke-linecap="round"/>

    <!-- EYES (whites) -->
    <ellipse cx="76" cy="120" rx="14" ry="9" fill="#fff"/>
    <ellipse cx="124" cy="120" rx="14" ry="9" fill="#fff"/>

    <!-- PUPILS -->
    <circle cx="76" cy="120" r="6.5" fill="#3d1a00"/>
    <circle cx="76" cy="120" r="4" fill="#1a0a00"/>
    <circle cx="124" cy="120" r="6.5" fill="#3d1a00"/>
    <circle cx="124" cy="120" r="4" fill="#1a0a00"/>
    <circle cx="78" cy="118" r="2" fill="#fff" opacity=".8"/>
    <circle cx="126" cy="118" r="2" fill="#fff" opacity=".8"/>

    <!-- LASHES TOP -->
    <path d="M62 113 Q70 108 90 112" fill="none" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M62 113 L58 108" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M70 110 L68 104" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M78 109 L78 103" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M86 110 L88 104" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M110 112 Q130 108 138 113" fill="none" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M138 113 L142 108" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M130 110 L132 104" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M122 109 L122 103" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>
    <path d="M114 110 L112 104" stroke="${lash}" stroke-width="${lashW}" stroke-linecap="round"/>

    <!-- NOSE -->
    <path d="M97 128 C95 140, 90 148, 93 152 C96 156, 104 156, 107 152 C110 148, 105 140, 103 128" fill="none" stroke="${skinSh}" stroke-width="1.8" stroke-linecap="round"/>

    <!-- LIPS -->
    <path d="M82 166 Q100 158 118 166 Q109 175 100 177 Q91 175 82 166Z" fill="${lip}"/>
    <path d="M82 166 Q91 171 100 172 Q109 171 118 166 Q109 180 100 182 Q91 180 82 166Z" fill="${lip}" opacity=".7"/>
    <path d="M82 166 Q100 162 118 166" fill="none" stroke="${lip}" stroke-width="1.2" opacity=".6"/>
    <!-- lip shine -->
    <ellipse cx="100" cy="168" rx="8" ry="2.5" fill="rgba(255,255,255,${state.lipDone?'.25':'0'})"/>

    <!-- HAIR FRONT layer -->
    <path d="${state.hairBrush
      ? 'M38 100 C36 75, 50 40, 100 30 C150 40, 164 75, 162 100'
      : 'M35 98 C30 65, 48 32, 100 26 C152 32, 170 65, 165 98'
    }" fill="${hairC}" opacity=".9"/>

    ${earrings}
    ${necklace}
  `;
}

/* =============================================
   TOOLS CONFIG
============================================= */
const TOOLS = [
  { id:'foundation', icon:'✨', label:'Foundation', msg:'Glow up! ✨', color:null,
    hint:'Tap face to apply foundation',
    apply(s){ s.foundation=true; return true; } },
  { id:'blush', icon:'🌸', label:'Blush', msg:'So rosy! 🌸', color:null,
    hint:'Tap cheeks to add blush',
    apply(s){ s.blush=true; return true; } },
  { id:'lipstick', icon:'💄', label:'Lipstick', msg:'Gorgeous lips! 💄', color:'lipColor',
    hint:'Pick a color then tap lips',
    apply(s,c){ s.lipColor=c||s.lipColor; s.lipDone=true; return true; } },
  { id:'eyeshadow', icon:'👁️', label:'Eyeshadow', msg:'Stunning eyes! 👁️', color:'eyeShadowColor',
    hint:'Pick a color then tap eyes',
    apply(s,c){ s.eyeShadowColor=c||s.eyeShadowColor; s.eyeShadowDone=true; return true; } },
  { id:'mascara', icon:'🖊️', label:'Mascara', msg:'Bold lashes! 🖊️', color:null,
    hint:'Tap eyes to apply mascara',
    apply(s){ s.mascara=true; return true; } },
  { id:'hairbrush', icon:'💇', label:'Hair Brush', msg:'Silky smooth! 💇', color:null,
    hint:'Tap hair to brush it',
    apply(s){ s.hairBrush=true; return true; } },
  { id:'haircolor', icon:'🎨', label:'Hair Color', msg:'Fabulous color! 🎨', color:'hairColor',
    hint:'Pick a color then tap hair',
    apply(s,c){ s.hairColor=c||s.hairColor; s.hairColorDone=true; return true; } },
  { id:'accessories', icon:'💍', label:'Accessories', msg:'So glamorous! 💍', color:null,
    hint:'Tap to add jewelry',
    apply(s){ s.accessories=true; return true; } },
];

/* =============================================
   GAME STATE
============================================= */
let activeTool = null;
const applied = new Set();
let colorPickers = {};

function resetState(){
  Object.assign(STATE,{
    foundation:false, blush:false, lipColor:'#e8003c', lipDone:false,
    eyeShadowColor:'#9b59b6', eyeShadowDone:false, mascara:false,
    hairBrush:false, hairColor:'#3d1a00', hairColorDone:false, accessories:false,
  });
  applied.clear();
  activeTool = null;
}

/* =============================================
   RENDER
============================================= */
function renderChar(){
  document.getElementById('char-svg').innerHTML = buildCharSVG(STATE);
}
function renderIntro(){
  // messy state for intro
  const s = { foundation:false,blush:false,lipColor:'#8b4046',lipDone:false,
    eyeShadowColor:'transparent',eyeShadowDone:false,mascara:false,
    hairBrush:false,hairColor:'#3d1a00',hairColorDone:false,accessories:false };
  document.querySelector('#intro svg').innerHTML = buildCharSVG(s);
}

/* =============================================
   TOOLBAR
============================================= */
function buildToolbar(){
  const bar = document.getElementById('toolbar');
  bar.innerHTML = '';
  TOOLS.forEach(tool => {
    const btn = document.createElement('div');
    btn.className = 'tool-btn' + (applied.has(tool.id)?' done':'');
    btn.id = 'tool-' + tool.id;
    btn.innerHTML = `<span class="tool-icon">${tool.icon}</span><span class="tool-label">${tool.label}</span>`;
    if(tool.color){
      const stateKey = tool.color;
      const colorDiv = document.createElement('div');
      colorDiv.className='color-swatch';
      colorDiv.style.background = STATE[stateKey];
      btn.appendChild(colorDiv);
      const inp = document.createElement('input');
      inp.type='color'; inp.value=STATE[stateKey];
      inp.id='cp-'+tool.id;
      inp.addEventListener('input', e => {
        STATE[stateKey] = e.target.value;
        colorDiv.style.background = e.target.value;
      });
      btn.appendChild(inp);
    }
    btn.addEventListener('click', () => selectTool(tool));
    bar.appendChild(btn);
  });
}

function selectTool(tool){
  activeTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tool-'+tool.id).classList.add('active');
  const status = document.getElementById('tool-status');
  status.innerHTML = `<div class="dot"></div> ${tool.icon} <strong>${tool.label}</strong> selected — ${tool.hint}`;
  if(tool.color){
    // open color picker
    document.getElementById('cp-'+tool.id).click();
  }
  showToast(`${tool.icon} ${tool.label} selected!`);
}

/* =============================================
   APPLY TOOL
============================================= */
function applyActiveTool(x, y){
  if(!activeTool) { showToast('👆 Pick a tool first!'); return; }
  const tool = activeTool;
  const colorKey = tool.color;
  const color = colorKey ? STATE[colorKey] : null;
  const changed = tool.apply(STATE, color);
  if(!changed) return;
  applied.add(tool.id);
  // mark done
  const btn = document.getElementById('tool-'+tool.id);
  btn.classList.add('done'); btn.classList.remove('active');
  renderChar();
  updateProgress();
  spawnEffects(x, y, tool.msg);
}

function updateProgress(){
  const pct = Math.round((applied.size / TOOLS.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  const finBtn = document.getElementById('btn-finish');
  if(applied.size >= 4) finBtn.disabled = false;
}

/* =============================================
   EFFECTS
============================================= */
function spawnEffects(x, y, msg){
  const stage = document.getElementById('stage');

  // Ripple
  const rip = document.createElement('div');
  rip.className='ripple'; rip.style.left=x+'px'; rip.style.top=y+'px';
  stage.appendChild(rip); setTimeout(()=>rip.remove(),700);

  // Float text
  const ft = document.createElement('div');
  ft.className='float-text'; ft.textContent=msg;
  ft.style.left=x+'px'; ft.style.top=(y-10)+'px';
  stage.appendChild(ft); setTimeout(()=>ft.remove(),950);

  // Sparkles
  const emojis=['✨','⭐','💫','🌟','💥'];
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const sp=document.createElement('div');
      sp.className='sparkle';
      sp.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      sp.style.left=(x+Math.random()*80-40)+'px';
      sp.style.top=(y+Math.random()*80-40)+'px';
      stage.appendChild(sp); setTimeout(()=>sp.remove(),750);
    },i*80);
  }
}

/* =============================================
   TOAST
============================================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

/* =============================================
   CLICK / TOUCH ON CHARACTER
============================================= */
function setupCharEvents(){
  const wrap = document.getElementById('char-wrap');
  function handleInteract(e){
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    let cx,cy;
    if(e.touches){
      cx=e.touches[0].clientX-rect.left; cy=e.touches[0].clientY-rect.top;
    } else {
      cx=e.clientX-rect.left; cy=e.clientY-rect.top;
    }
    // position relative to stage for effects
    const stageRect = document.getElementById('stage').getBoundingClientRect();
    const sx = (e.touches?e.touches[0].clientX:e.clientX)-stageRect.left;
    const sy = (e.touches?e.touches[0].clientY:e.clientY)-stageRect.top;
    applyActiveTool(sx,sy);
  }
  wrap.addEventListener('click',handleInteract);
  wrap.addEventListener('touchstart',handleInteract,{passive:false});
}

/* =============================================
   SCREEN TRANSITIONS
============================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startGame(){
  resetState();
  buildToolbar();
  renderChar();
  updateProgress();
  document.getElementById('btn-finish').disabled=true;
  document.getElementById('tool-status').innerHTML='👆 Select a tool below to begin';
  showScreen('game');
  setupCharEvents();
}

/* =============================================
   FINISH
============================================= */
function showFinish(){
  // Build before SVG (fully messy)
  const messy={foundation:false,blush:false,lipColor:'#8b4046',lipDone:false,
    eyeShadowColor:'transparent',eyeShadowDone:false,mascara:false,
    hairBrush:false,hairColor:'#3d1a00',hairColorDone:false,accessories:false};
  document.getElementById('before-svg').innerHTML=buildCharSVG(messy);
  // Build after SVG (current state)
  document.getElementById('after-svg').innerHTML=buildCharSVG(STATE);

  // Score
  const pct = Math.round((applied.size/TOOLS.length)*100);
  const score = pct;
  document.getElementById('score-num').textContent=score+'%';
  const stars=score>=90?'⭐⭐⭐⭐⭐':score>=70?'⭐⭐⭐⭐':score>=50?'⭐⭐⭐':score>=30?'⭐⭐':'⭐';
  document.getElementById('score-stars').textContent=stars;

  showScreen('finish');
  launchConfetti();
}

function resetGame(){
  showScreen('intro');
  renderIntro();
}

/* =============================================
   CONFETTI
============================================= */
function launchConfetti(){
  const c=document.getElementById('confetti-canvas');
  c.width=innerWidth; c.height=innerHeight;
  const ctx=c.getContext('2d');
  const colors=['#f5c518','#ff6eb4','#9b59b6','#fff','#ff4444','#44ff88'];
  const pieces=[];
  for(let i=0;i<120;i++){
    pieces.push({
      x:Math.random()*c.width, y:Math.random()*c.height-c.height,
      r:Math.random()*6+3, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360, vx:(Math.random()-0.5)*4, vy:Math.random()*5+2,
      vr:Math.random()*8-4,
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.beginPath();
      ctx.rect(-p.r/2,-p.r/2,p.r,p.r); ctx.fill(); ctx.restore();
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=.12;
    });
    frame++;
    if(frame<180) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,c.width,c.height);
  }
  draw();
}

/* =============================================
   INIT
============================================= */
renderIntro();
</script>
